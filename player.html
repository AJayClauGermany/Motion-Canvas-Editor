<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scene</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      body { font: 13px/1.4 system-ui, sans-serif; color: #dbe2ee; }
      #stage { position: fixed; inset: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
      #stage canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
      #big { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; opacity: 0; transition: opacity 0.15s; }
      #big span { width: 72px; height: 72px; border-radius: 50%; background: rgba(0, 0, 0, 0.55); display: grid; place-items: center; }
      #big svg { width: 30px; height: 30px; fill: #fff; margin-left: 4px; }
      body.paused #big { opacity: 1; }
      #bar { position: fixed; left: 0; right: 0; bottom: 0; height: 22px; display: flex; align-items: flex-end; cursor: pointer; opacity: 0; transition: opacity 0.15s; touch-action: none; }
      body:hover #bar, body.paused #bar, #bar:focus-visible { opacity: 1; }
      #track { flex: 1; height: 4px; background: rgba(255, 255, 255, 0.22); transition: height 0.1s; }
      #bar:hover #track { height: 8px; }
      #fill { height: 100%; width: 0; background: #58c4dd; }
      body.bare #bar, body.bare #big { display: none; }
      #message { position: fixed; inset: 0; display: none; place-items: center; padding: 24px; text-align: center; color: #9aa5b8; white-space: pre-wrap; }
      body.failed #message { display: grid; }
    </style>
  </head>
  <body>
    <div id="stage" role="button" aria-label="Play or pause the animation" tabindex="0"></div>
    <div id="big" aria-hidden="true"><span><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z" /></svg></span></div>
    <div id="bar" role="slider" aria-label="Position" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0"><div id="track"><div id="fill"></div></div></div>
    <div id="message"></div>
    <script type="application/json" id="mce-scene">"__MCE_SCENE_DATA__"</script>
    <script type="module" src="/src/player.ts"></script>
  </body>
</html>
